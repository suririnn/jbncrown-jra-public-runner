name: JBN CROWN public synthetic-only calculation verification

# One-time diagnostic/demo preserved; run manually only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify that the repository has only demo-safe inputs
        shell: bash
        run: |
          set -euo pipefail
          test ! -e private-data
          test ! -e originals
          test ! -e raw-odds
          test ! -e results
          test ! -e .env
          echo 'PUBLIC_INPUTS_ONLY: synthetic fixtures; no JRA official originals or private model weights'
      - name: Test research rules, all 7 ticket markets, 7 conditions and 12 series
        run: python -m unittest discover -s tests -v
      - name: Independently compute and merge 11 fictional JRA-shaped months
        shell: bash
        run: |
          set -euo pipefail
          python examples/create_synthetic.py
          mkdir -p /tmp/jbn-2026-synthetic
          for m in 01 02 03 04 05 06 07 08 09 10 11; do
            python run_month.py --month "$m" --input-dir examples/synthetic --output-dir /tmp/jbn-2026-synthetic --demo-only
          done
          python merge_months.py --input-dir /tmp/jbn-2026-synthetic --output /tmp/jbn-2026-synthetic/merged.json --demo-only
          python - <<'PY'
          import json
          with open('/tmp/jbn-2026-synthetic/merged.json',encoding='utf-8') as f:
              x=json.load(f)
          assert x["source_type"]=="synthetic_only", "Real source was unexpectedly introduced"
          assert x["races"]==11 and x["month_count"]==11
          assert x["production_adoptions"]==0
          print("PUBLIC_CI_SYNTHETIC_PASS 11 months; 7 conditions; 12 research series; 0 actual official JRA races scored")
          PY
